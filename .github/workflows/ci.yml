name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add toolchain components
        run: rustup component add rustfmt clippy
      # uv is here only to run prek. `enable-cache` defaults to `auto`, which is
      # on for this event, and its key needs a Python dependency manifest this
      # repository does not have, so turn it off rather than keep a cache that
      # can never be invalidated.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Commit-stage hooks
        run: uvx prek@0.4.14 run --all-files
      - name: Push-stage hooks
        run: uvx prek@0.4.14 run --all-files --hook-stage pre-push
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release
      - name: Install smoke test
        run: |
          cargo install --path . --root "$RUNNER_TEMP/skillctl"
          "$RUNNER_TEMP/skillctl/bin/skillctl" --version
