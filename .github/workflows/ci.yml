name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add toolchain components
        run: rustup component add rustfmt clippy
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Commit-stage hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.4.x"
      - name: Push-stage hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.4.x"
          extra-args: --all-files --hook-stage pre-push
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release
      - name: Install smoke test
        # Reuse the release artifacts from the previous step instead of
        # letting cargo install compile a third time in its own target dir.
        run: |
          cargo install --path . --root "$RUNNER_TEMP/skillctl" --locked --target-dir target
          "$RUNNER_TEMP/skillctl/bin/skillctl" --version
