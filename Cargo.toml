[package]
name = "skillctl"
version = "0.3.2"
edition = "2021"
description = "Reproducible project-local and global agent skill manager"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"

[profile.release]
strip = true
lto = "thin"
